# Kamal 2 deploy: single VPS running the app (with Solid Queue in Puma) and
# Postgres as an accessory on the same box. Set CENTIME_SERVER_IP, the domain,
# and registry credentials before the first `kamal setup`.
service: centime

image: <%= ENV.fetch("KAMAL_REGISTRY_USER", "centime") %>/centime

servers:
  web:
    - <%= ENV.fetch("CENTIME_SERVER_IP", "192.168.0.1") %>

# SSL via kamal-proxy + Let's Encrypt. Requires assume_ssl/force_ssl in production.rb.
proxy:
  ssl: true
  host: <%= ENV.fetch("CENTIME_HOST", "centime.example.com") %>

registry:
  server: ghcr.io
  username: <%= ENV.fetch("KAMAL_REGISTRY_USER", "changeme") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - CENTIME_DATABASE_PASSWORD
    - GOCARDLESS_SECRET_ID
    - GOCARDLESS_SECRET_KEY
    - STRIPE_PRIVATE_KEY
    - STRIPE_SIGNING_SECRET
    - STRIPE_PRO_PRICE_ID
  clear:
    # Run the Solid Queue supervisor inside Puma — fine on one VPS. Split into
    # a dedicated job server if sync load ever demands it.
    SOLID_QUEUE_IN_PUMA: true
    DB_HOST: centime-db

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "centime_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

accessories:
  db:
    image: postgres:18
    host: <%= ENV.fetch("CENTIME_SERVER_IP", "192.168.0.1") %>
    # Bound to localhost: only reachable through the docker network / SSH.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: centime
        POSTGRES_DB: centime_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
